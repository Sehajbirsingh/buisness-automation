<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Productivity Booster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
  <div class="container py-5">
    <div class="card shadow-lg p-4">
      <h2 class="mb-4 text-center">🚀 Productivity Booster - AI Assistant</h2>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Email (for notification):</label>
          <input name="email" type="email" class="form-control" placeholder="example@domain.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Meeting Time (optional)</label>
          <input name="meeting_time" type="text" class="form-control" placeholder="YYYY-MM-DD HH:MM">
        </div>
        <div class="mb-3">
          <label class="form-label">Upload Files</label>
          <input name="files" type="file" class="form-control" multiple>
        </div>
        <div class="mb-3">
          <label class="form-label">Select Task</label>
          <select class="form-select" name="task" required>
            <option value="full">🔁 Full Productivity Flow</option>
            <option value="summarize">📝 Summarize Emails</option>
            <option value="send_email">📤 Send Onboarding Email</option>
            <option value="schedule_meeting">📅 Schedule Meeting</option>
            <option value="generate_report">📊 Generate Report</option>
            <option value="fill_form">🧾 Fill Out Form</option>
            <option value="follow_up">📩 Follow-Up Email</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">🚀 Run Task</button>
      </form>
    </div>
  </div>
</body>
</html>
